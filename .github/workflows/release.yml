name: Build and Release
run-name: Release ${{ inputs.version || github.ref_name }} by @${{ github.actor }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.2)'
        required: true
        default: 'v1.0.2'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Resolve version
      id: version
      shell: pwsh
      run: |
        $tagName = "${{ inputs.version || github.ref_name }}"
        if ([string]::IsNullOrWhiteSpace($tagName)) {
          throw "Release version is empty."
        }

        if (-not $tagName.StartsWith("v")) {
          $tagName = "v$tagName"
        }

        $packageVersion = $tagName -replace '^v', ''
        if ($packageVersion -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
          throw "Version '$packageVersion' must use a numeric version like 1.0.2 or 1.0.2.0."
        }

        $fileVersion = $packageVersion
        if (($packageVersion.Split('.')).Count -eq 3) {
          $fileVersion = "$packageVersion.0"
        }

        "tag_name=$tagName" >> $env:GITHUB_OUTPUT
        "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
        "file_version=$fileVersion" >> $env:GITHUB_OUTPUT

    - name: Publish
      run: |
        dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.package_version }} -o ./publish

    - name: Setup Inno Setup
      shell: pwsh
      run: |
        choco install innosetup --no-progress -y

    - name: Build installer
      shell: pwsh
      run: |
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) {
          $iscc = "iscc"
        }

        New-Item -ItemType Directory -Force -Path ./dist | Out-Null
        & $iscc ./installer/FluidScroll.iss /DAppVersion=${{ steps.version.outputs.package_version }} /DAppFileVersion=${{ steps.version.outputs.file_version }} /DSourceDir="..\publish"

        if (-not (Test-Path "./dist/FluidScrollSetup.exe")) {
          throw "Installer was not produced at ./dist/FluidScrollSetup.exe."
        }

    - name: Update WinGet manifest
      shell: pwsh
      run: |
        $installerPath = "./dist/FluidScrollSetup.exe"
        if (-not (Test-Path $installerPath)) {
          throw "Installer was not found at $installerPath."
        }

        $hash = (Get-FileHash $installerPath -Algorithm SHA256).Hash
        $tagName = "${{ steps.version.outputs.tag_name }}"
        $packageVersion = "${{ steps.version.outputs.package_version }}"
        $installerUrl = "https://github.com/${{ github.repository }}/releases/download/$tagName/FluidScrollSetup.exe"
        $manifestPath = "./winget/FluidScroll.yaml"

        $manifest = Get-Content -Raw $manifestPath
        $manifest = $manifest -replace '(?m)^PackageVersion:.*$', "PackageVersion: $packageVersion"
        $manifest = $manifest -replace '(?m)^(\s*)InstallerType:.*$', "    InstallerType: inno"
        $manifest = $manifest -replace '(?m)^(\s*)InstallerUrl:.*$', "    InstallerUrl: $installerUrl"
        $manifest = $manifest -replace '(?m)^(\s*)InstallerSha256:.*$', "    InstallerSha256: $hash"
        Set-Content -Path $manifestPath -Value $manifest -NoNewline

        "$hash  FluidScrollSetup.exe" | Set-Content -Path "./dist/FluidScrollSetup.exe.sha256"

    - name: Create or update release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_NAME: ${{ steps.version.outputs.tag_name }}
      shell: pwsh
      run: |
        $assets = @(
          "./publish/FluidScroll.exe",
          "./dist/FluidScrollSetup.exe",
          "./dist/FluidScrollSetup.exe.sha256",
          "./winget/FluidScroll.yaml"
        )

        gh release view $env:TAG_NAME 1>$null 2>$null
        if ($LASTEXITCODE -eq 0) {
          gh release upload $env:TAG_NAME @assets --clobber
        }
        else {
          gh release create $env:TAG_NAME @assets --title "FluidScroll $env:TAG_NAME" --generate-notes
        }
